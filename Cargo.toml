[package]
name = "appsignal-cli"
version = "2.1.0"
edition = "2021"
description = "CLI tool for interacting with AppSignal"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
toml = "0.8"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
rand = "0.8"
semver = "1"
sha2 = "0.10"
base64 = "0.22"
url = "2"
tabled = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"
