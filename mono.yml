---
language: "custom"
repo: "https://github.com/appsignal/appsignal-cli"
build:
  command: 'test "$CI" = "true" || { echo "Can only build from GitHub Actions"; exit 1; }'
publish:
  command: 'test "$CI" = "true" || { echo "Can only publish from GitHub Actions"; exit 1; }'
test:
  command: "cargo test"

read_version: "script/read_version"
write_version: "script/write_version"
version_scheme: "semver"
